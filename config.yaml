# Configuração central do projeto — ajuste aqui, não no código

sample:
  start_date: "2005-01-01"
  end_date: "2024-12-31"
  frequency: "daily"

assets:
  # categoria: equity | commodity | fx
  - name: "SLC Agrícola"
    ticker: "SLCE3.SA"
    category: "equity"
  - name: "JBS"
    ticker: "JBSS32.SA"  # BDR na B3; JBSS3.SA foi descontinuado após reincorporação para JBS N.V. (NYSE: JBS)
    category: "equity"
  - name: "Marfrig"
    ticker: "MBRF3.SA"  # MRFG3.SA foi descontinuado após fusão Marfrig-BRF (nova entidade combinada)
    category: "equity"
  - name: "São Martinho"
    ticker: "SMTO3.SA"
    category: "equity"
  - name: "Soja (Soybean futures)"
    ticker: "ZS=F"
    category: "commodity"
  - name: "Café Arábica (Coffee futures)"
    ticker: "KC=F"
    category: "commodity"
  - name: "USD/BRL"
    ticker: "BRL=X"
    category: "fx"

portfolio:
  weighting: "equal_weighted"

macro_features:
  bcb_sgs:
    - selic
    - ipca
    - ibc_br
  external:
    - embi_plus
    - us_treasury_10y
    - dxy

features:
  volatility:
    - garman_klass
    - garch_1_1_univariate
    - implied_vol_proxy   # VIX / IVol-B3
  returns_lags: [1, 5, 21]
  rolling_windows: [21, 63]
  liquidity_proxy: "bid_ask_spread_normalized"
  vif_threshold: 10

split:
  walk_forward:
    development_years: 5        # treino + validação + calibração
    test_months: 6
    step_months: 6
    calibration_sessions: 252   # erros usados no VaR/ES (simulação histórica filtrada)
    validation_fraction: 0.15   # do que sobra antes da calibração; só para early stopping

hmm:
  states_range: [2, 3, 4]
  selection_criteria: ["bic", "aic"]
  covariance_type: "full"

lstm:
  # Configuração fixada antes do experimento (não houve busca em grade).
  lookback: 42
  layers: [64, 32]
  dropout: 0.3
  batch_size: 32
  learning_rate: 0.001
  optimizer: "adam"
  early_stopping_patience: 15

var_es:
  ewma_lambda: 0.94             # escala RiskMetrics da carteira (ou do ativo)
  min_regime_pool: 100          # HMM-LSTM: cauda do regime só com >= 100 erros

mc_dropout:
  n_samples: 1000

risk:
  confidence_levels: [0.95, 0.99]

msgarch_benchmark:
  states_range: [2, 3]          # escolhido pelo BIC no desenvolvimento
  distribution: "student_t"
  method: "FHS"                 # paramétrico guardado como sensibilidade

random_seed: 42
