# Configuração central do projeto — ajuste aqui, não no código

sample:
  start_date: "2005-01-01"
  end_date: "2024-12-31"
  frequency: "daily"

assets:
  # categoria: equity | commodity | fx
  - name: "SLC Agrícola"
    ticker: "SLCE3.SA"
    category: "equity"
  - name: "JBS"
    ticker: "JBSS32.SA"  # BDR na B3; JBSS3.SA foi descontinuado após reincorporação para JBS N.V. (NYSE: JBS)
    category: "equity"
  - name: "Marfrig"
    ticker: "MBRF3.SA"  # MRFG3.SA foi descontinuado após fusão Marfrig-BRF (nova entidade combinada)
    category: "equity"
  - name: "São Martinho"
    ticker: "SMTO3.SA"
    category: "equity"
  - name: "Soja (Soybean futures)"
    ticker: "ZS=F"
    category: "commodity"
  - name: "Café Arábica (Coffee futures)"
    ticker: "KC=F"
    category: "commodity"
  - name: "USD/BRL"
    ticker: "BRL=X"
    category: "fx"

portfolio:
  weighting: "equal_weighted"

macro_features:
  bcb_sgs:
    - selic
    - ipca
    - ibc_br
  external:
    - embi_plus
    - us_treasury_10y
    - dxy

features:
  volatility:
    - garman_klass
    - garch_1_1_univariate
    - implied_vol_proxy   # VIX / IVol-B3
  returns_lags: [1, 5, 21]
  rolling_windows: [21, 63]
  liquidity_proxy: "bid_ask_spread_normalized"
  vif_threshold: 10

split:
  train: 0.70
  validation: 0.15
  test: 0.15
  walk_forward:
    train_window_years: 5
    test_window_months: 6
    step_months: 6

hmm:
  states_range: [2, 3, 4]
  selection_criteria: ["bic", "aic"]
  covariance_type: "full"

lstm:
  lookback_grid: [21, 42, 63]
  dropout_grid: [0.2, 0.3, 0.4]
  batch_size_grid: [32, 64]
  learning_rate_grid: [0.001, 0.0005]
  layers: [64, 32]
  activation: "tanh"
  optimizer: "adam"
  early_stopping_patience: 15

mc_dropout:
  n_samples: 1000

risk:
  confidence_levels: [0.95, 0.99]

msgarch_benchmark:
  states_range: [2, 3]
  distribution: "student_t"
  method: "FHS"

random_seed: 42
